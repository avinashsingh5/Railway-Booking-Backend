
server:
  port: 8082

spring:
  application:
    name: train-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/railway_train}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

  jackson:
    default-property-inclusion: non_null

internal:
  api-key: ${INTERNAL_API_KEY}

fare:
  minimum: 50

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
